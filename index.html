<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoomMitra – Rooms, Flats, PG & Hostels in India</title>
<meta name="description" content="RoomMitra connects room owners directly with tenants across India. Browse rooms, flats, PG, hostels and shared rooms. Free to list, free to search.">
<style>
:root{--bg:#fff;--fg:#14211f;--mut:#5d6b69;--card:#fff;--soft:#f1f8f6;--line:#e1ebe8;--ac:#0f9d8a;--ac2:#0b7a6b;--red:#d6405a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1716;--fg:#e8f2f0;--mut:#9bb0ac;--card:#152321;--soft:#13201e;--line:#25403b;--ac:#2cc4ae;--ac2:#4fd8c4}}
:root[data-theme="dark"]{--bg:#0e1716;--fg:#e8f2f0;--mut:#9bb0ac;--card:#152321;--soft:#13201e;--line:#25403b;--ac:#2cc4ae;--ac2:#4fd8c4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:12px;height:58px}
.logo{font-weight:800;font-size:20px;color:var(--ac)}.logo b{color:var(--fg)}
.nl{display:flex;gap:6px;margin-left:auto;align-items:center}
.nl a,.nl button{padding:8px 12px;border-radius:99px;border:0;background:none;cursor:pointer;font-weight:600}
.nl a:hover,.nl button:hover{background:var(--soft)}
.burger{display:none;margin-left:auto;border:1px solid var(--line);background:none;border-radius:10px;padding:6px 10px;font-size:18px}
@media(max-width:760px){.burger{display:block}.nl{display:none;position:absolute;top:58px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;padding:8px 16px;border-bottom:1px solid var(--line)}.nl.open{display:flex}}
.btn{display:inline-block;background:var(--ac);color:#fff!important;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;text-align:center}
.btn:hover{background:var(--ac2)}.btn.o{background:none;color:var(--ac)!important;border:1.5px solid var(--ac)}.btn.r{background:var(--red)}.btn.s{padding:6px 12px;font-size:13px}
.hero{background:#0b4f48;color:#fff;padding:52px 0 32px;box-shadow:0 0 0 100vmax #0b4f48;clip-path:inset(0 -100vmax)}
h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0 0 8px}h2{font-size:22px;margin:32px 0 14px}h3{margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px}
.sb,.fl{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.12)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:3px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;height:170px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:44px;background-size:cover}
.fav{position:absolute;top:10px;right:10px;border:0;border-radius:50%;width:36px;height:36px;background:#fff;color:#aab;font-size:18px;cursor:pointer}.fav.on{color:var(--red)}
.tag{position:absolute;left:10px;top:10px;background:#fff;color:#14211f;border-radius:99px;font-size:11px;font-weight:700;padding:3px 9px}
.dots{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 3px #0008}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pr{font-weight:800;font-size:18px;color:var(--ac)}.pr small{color:var(--mut);font-weight:500}
.mut{color:var(--mut);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cat button,.city{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 10px;font-weight:700;cursor:pointer;text-align:center}
.cat button:hover,.city:hover{border-color:var(--ac);color:var(--ac)}
.cta{background:#0b4f48;color:#fff;border-radius:12px;padding:32px;margin:34px 0}
.cta .btn{background:#fff;color:var(--ac2)!important}
.ad{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--mut);font-size:12px;margin:24px 0}
footer{background:#0a2f2b;color:#bcd3cf;margin-top:40px;padding:34px 0 18px}
footer .w{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between}
.dt{display:grid;gap:22px;grid-template-columns:1.4fr 1fr;margin-top:18px}@media(max-width:820px){.dt{grid-template-columns:1fr}}
.main{height:320px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:70px;background-size:cover!important}
.th{display:flex;gap:8px;margin-top:8px}.th div{width:76px;height:56px;border-radius:10px;cursor:pointer;background-size:cover!important;border:2px solid transparent}.th .on{border-color:var(--ac)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st div{background:var(--soft);border-radius:14px;padding:14px}.st b{font-size:24px;display:block}
.fm{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.fm .f{grid-column:1/-1}
.sc{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tr{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:16px;color:#bfe3dd;font-size:13px}.tr span::before{content:"✓ "}.hero .sub{color:#bfe3dd}.hw{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.hw div{border-top:3px solid var(--ac);padding-top:12px}.hw b{color:var(--ac);font-size:13px;letter-spacing:.08em}.fc{display:flex;flex-direction:column;gap:6px;min-width:140px;max-width:280px}.fc b{color:#fff}.fc a{font-weight:500}.fc p{margin:0}.cp{margin-top:22px;font-size:12px;border-top:1px solid #ffffff22;padding-top:14px}</style><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"></head><body>
<nav><div class="w"><a class="logo" href="#home"><svg width="26" height="26" viewBox="0 0 24 24" style="vertical-align:-6px;margin-right:7px"><rect width="24" height="24" rx="6" fill="#0f9d8a"/><path d="M5 12l7-6 7 6v7h-5v-4h-4v4H5z" fill="#fff"/></svg>Room<b>Mitra</b></a><button class="burger" onclick="document.getElementById('nl').classList.toggle('open')" aria-label="Menu">☰</button><div class="nl" id="nl"></div></div></nav>
<main id="app" class="w"></main>
<footer><div class="w"><div class="fc"><b>RoomMitra</b><p>Direct owner–tenant rentals across India. Free to list. Free to search.</p></div><div class="fc"><b>Company</b><a href="#about">About</a><a href="#contact">Contact</a></div><div class="fc"><b>For owners</b><a href="#add">List a property</a><a href="#owner">Owner dashboard</a></div><div class="fc"><b>Legal</b><a href="#privacy">Privacy Policy</a><a href="#terms">Terms</a></div></div><div class="w cp">© 2026 RoomMitra. All rights reserved.</div></footer>
<script>
/* DATA LAYER: demo mode uses localStorage. For Firebase swap load()/save() and auth helpers for
   Firestore: users/{uid}, listings/{id}, favorites/{uid_listingId}, enquiries/{id}, reports/{id};
   Storage: listings/{ownerUid}/{listingId}/{n}.jpg. Rules: owners write only own listings (status forced to "pending"),
   admins (custom claim) change status/delete anything, tenants write own favorites/enquiries/reports. */
const CITIES=['Delhi','Mumbai','Bengaluru','Pune','Hyderabad','Jaipur','Kota','Lucknow'];
const TYPES=['Single Room','1BHK','2BHK','PG','Hostel','Shared Room'];
const AM=['WiFi','Attached Bath','AC','Geyser','Parking','Power Backup','Meals','Laundry','CCTV','Lift'];
const T={en:{tag:'Find a Room That Feels Like Home',sub:'Rooms, flats, PG, hostels and shared rooms – directly from owners.',city:'City',loc:'Locality',type:'Property Type',bud:'Max Budget (₹)',go:'Search',feat:'Featured Rooms',rec:'Recently Added',pop:'Popular Cities',cats:'Categories',cta:'List Your Property for Free',ctas:'No fees for posting in this first version.',any:'Any',view:'View Details',dep:'Deposit',mo:'/month',login:'Login / Register',out:'Logout',saved:'Saved',dash:'Dashboard',add:'Add Listing',srch:'Search',nores:'No rooms match these filters.',lang:'हिंदी'},
hi:{tag:'घर जैसा कमरा खोजें',sub:'कमरे, फ्लैट, पीजी, हॉस्टल और शेयर्ड रूम – सीधे मालिक से।',city:'शहर',loc:'इलाका',type:'प्रॉपर्टी प्रकार',bud:'अधिकतम बजट (₹)',go:'खोजें',feat:'चुनिंदा कमरे',rec:'हाल ही में जोड़े गए',pop:'लोकप्रिय शहर',cats:'श्रेणियाँ',cta:'अपनी प्रॉपर्टी मुफ़्त में लिस्ट करें',ctas:'इस पहले संस्करण में पोस्टिंग पर कोई शुल्क नहीं।',any:'कोई भी',view:'विवरण देखें',dep:'जमा राशि',mo:'/माह',login:'लॉगिन / रजिस्टर',out:'लॉगआउट',saved:'पसंदीदा',dash:'डैशबोर्ड',add:'लिस्टिंग जोड़ें',srch:'खोज',nores:'कोई कमरा नहीं मिला।',lang:'English'}};
let D={L:[],fav:[],enq:[],rep:[],user:null,lang:(()=>{try{return localStorage.getItem('rml')||'en'}catch(e){return'en'}})()};const save=()=>{try{localStorage.setItem('rml',D.lang)}catch(e){}};
const t=k=>(T[D.lang]||T.en)[k]||T.en[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const scene=(h,i)=>{const k=(h+i*25)%360,w=`hsl(${k} 35% 88%)`,f=`hsl(${k} 25% 62%)`,a=`hsl(${k} 55% 40%)`,o=i%2,wx=o?250:40,bx=o?40:220;const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='${w}'/><rect y='190' width='400' height='70' fill='${f}'/><rect x='${wx}' y='40' width='110' height='90' rx='4' fill='#fff' stroke='${a}' stroke-width='6'/><path d='M${wx+55} 40v90M${wx} 85h110' stroke='${a}' stroke-width='3'/><rect x='${bx}' y='130' width='140' height='70' rx='6' fill='${a}'/><rect x='${bx+10}' y='112' width='50' height='26' rx='8' fill='#fff'/><rect x='${bx}' y='200' width='8' height='20' fill='${a}'/><rect x='${bx+132}' y='200' width='8' height='20' fill='${a}'/></svg>`;return `url(data:image/svg+xml,${encodeURIComponent(s).replace(/'/g,'%27').replace(/\(/g,'%28').replace(/\)/g,'%29')}) center/cover`};
const bg=(l,i)=>l.photos&&l.photos[i]?`url(${l.photos[i]}) center/cover`:scene(l.hue,i);
const np=l=>(l.photos&&l.photos.length)||3;
const isFav=id=>D.fav.includes(id);
let F={city:'',loc:'',min:'',max:'',type:'',gen:'',fur:'',occ:''};
const opts=(a,v)=>`<option value="">${t('any')}</option>`+a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const card=l=>`<article class="card"><div class="ph" id="p${l.id}" style="background:${bg(l,0)}" data-i="0" onclick="cyc(${l.id})">${l.feat?'<span class="tag">Featured</span>':''}<button class="fav ${isFav(l.id)?'on':''}" aria-label="Save" onclick="event.stopPropagation();tf(${l.id})">♥</button><span class="dots">◀ 1/${np(l)} ▶</span></div>
<div class="cb"><h3>${esc(l.title)}</h3><div class="pr">${inr(l.rent)}<small>${t('mo')}</small></div><div class="mut">${esc(l.loc)}, ${esc(l.city)}</div>
<div class="chips"><span class="chip">${l.type}</span><span class="chip">${l.fur}</span><span class="chip">${l.gen==='Any'?'Male / Female':l.gen+' only'}</span></div>
<div class="mut">${t('dep')}: ${inr(l.dep)}</div><a class="btn s" style="margin-top:auto" href="#room-${l.id}">${t('view')}</a></div></article>`;
function cyc(id){const l=D.L.find(x=>x.id===id),e=document.getElementById('p'+id);if(!l||!e)return;const i=(+e.dataset.i+1)%np(l);e.dataset.i=i;e.style.background=bg(l,i);e.querySelector('.dots').textContent='◀ '+(i+1)+'/'+np(l)+' ▶'}
function tf(id){const i=D.fav.indexOf(id);i<0?D.fav.push(id):D.fav.splice(i,1);save();document.querySelectorAll('.fav').forEach(b=>{if(b.getAttribute('onclick').includes('tf('+id+')'))b.classList.toggle('on',isFav(id))})}
const live=()=>D.L.filter(l=>l.status==='approved');
const filt=()=>live().filter(l=>(!F.city||l.city===F.city)&&(!F.loc||l.loc.toLowerCase().includes(F.loc.toLowerCase()))&&(!F.min||l.rent>=+F.min)&&(!F.max||l.rent<=+F.max)&&(!F.type||l.type===F.type)&&(!F.gen||l.gen===F.gen)&&(!F.fur||l.fur===F.fur)&&(!F.occ||l.occ===F.occ));
function nav(){const u=D.user;document.getElementById('nl').innerHTML=`<a href="#search">${t('srch')}</a><a href="#saved">♥ ${t('saved')}</a>${u?(u.role==='owner'?`<a href="#owner">${t('dash')}</a><a href="#add">${t('add')}</a>`:u.role==='admin'?`<a href="#admin">Admin</a>`:`<a href="#profile">${esc(u.name)}</a>`)+`<button onclick="logout()">${t('out')}</button>`:`<a href="#login">${t('login')}</a>`}<button onclick="D.lang=D.lang==='en'?'hi':'en';save();render()">${t('lang')}</button><button onclick="dark()" aria-label="Theme">◐</button>`;document.getElementById('nl').classList.remove('open')}
function dark(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1716';r.dataset.theme=d?'light':'dark'}
function logout(){D.user=null;save();location.hash='home';render()}
const go=h=>{location.hash=h};
const ad=()=>`<div class="ad">Advertisement</div>`;
function home(){return `<section class="hero" style="margin:0 -16px;padding-left:16px;padding-right:16px"><h1>${t('tag')}</h1><p class="sub">${t('sub')}</p>
<div class="sb"><div><label>${t('city')}</label><select id="hc">${opts(CITIES)}</select></div><div><label>${t('loc')}</label><input id="hl" placeholder="e.g. Andheri"></div><div><label>${t('type')}</label><select id="ht">${opts(TYPES)}</select></div><div><label>${t('bud')}</label><input id="hb" type="number" min="0" placeholder="15000"></div><div style="align-self:end"><button class="btn" style="width:100%" onclick="hs()">${t('go')}</button></div></div><div class="tr"><span>Direct owner contact</span><span>Free to list and search</span><span>Hindi &amp; English</span></div></section>
<h2>${t('feat')}</h2><div class="g">${live().filter(l=>l.feat).map(card).join('')}</div>
<h2>${t('cats')}</h2><div class="cat">${TYPES.map(x=>`<button onclick="F={city:'',loc:'',min:'',max:'',type:'${x}',gen:'',fur:'',occ:''};go('search')">${x}</button>`).join('')}</div>
<h2>${t('rec')}</h2><div class="g">${[...live()].sort((a,b)=>b.t-a.t).slice(0,4).map(card).join('')}</div>${ad()}
<h2>${t('pop')}</h2><div class="cat">${CITIES.map(c=>`<button class="city" onclick="F={city:'${c}',loc:'',min:'',max:'',type:'',gen:'',fur:'',occ:''};go('search')">${c}<div class="mut">${live().filter(l=>l.city===c).length} listings</div></button>`).join('')}</div>
<h2>How it works</h2><div class="hw"><div><b>STEP 1</b><h3>Search</h3><p class="mut">Filter by city, budget, room type and who the room is for.</p></div><div><b>STEP 2</b><h3>Contact the owner</h3><p class="mut">Message on WhatsApp or call directly. No middlemen.</p></div><div><b>STEP 3</b><h3>Visit and decide</h3><p class="mut">See the place in person before you pay anything.</p></div></div><div class="cta"><h2 style="margin:0 0 6px">${t('cta')}</h2><p style="margin:0 0 14px">${t('ctas')}</p><a class="btn" href="#${D.user&&D.user.role==='owner'?'add':'login'}">${t('add')}</a></div>`}
function hs(){F={city:hc.value,loc:hl.value,min:'',max:hb.value,type:ht.value,gen:'',fur:'',occ:''};go('search')}
function setF(k,v){F[k]=v;document.getElementById('res').innerHTML=res()}
const res=()=>{const r=filt();return r.length?`<div class="g">${r.map(card).join('')}</div>`:`<p class="mut">${t('nores')}</p>`};
function search(){const s=(k,l,a)=>`<div><label>${l}</label><select onchange="setF('${k}',this.value)">${opts(a,F[k])}</select></div>`;
return `<h2>${t('srch')}</h2><div class="fl">${s('city',t('city'),CITIES)}<div><label>${t('loc')}</label><input value="${esc(F.loc)}" oninput="setF('loc',this.value)"></div><div><label>Min ₹</label><input type="number" value="${F.min}" oninput="setF('min',this.value)"></div><div><label>Max ₹</label><input type="number" value="${F.max}" oninput="setF('max',this.value)"></div>${s('type','Room / PG / Hostel',TYPES)}${s('gen','Male / Female / Any',['Male','Female','Any'])}${s('fur','Furnishing',['Furnished','Semi-furnished','Unfurnished'])}${s('occ','Single / Shared',['Single','Shared'])}<div style="align-self:end"><button class="btn o" style="width:100%" onclick="F={city:'',loc:'',min:'',max:'',type:'',gen:'',fur:'',occ:''};render()">Reset</button></div></div><div id="res" style="margin-top:18px">${res()}</div>`}
function room(id){const l=D.L.find(x=>x.id===id);if(!l)return'<p>Listing not found.</p>';document.title=l.title+' – '+l.city+' | RoomMitra';
const wa=`https://wa.me/91${l.phone}?text=${encodeURIComponent('Hi, I saw your listing “'+l.title+'” on RoomMitra. Is it available?')}`;
return `<a class="mut" href="#search">← ${t('srch')}</a><div class="dt"><div><div class="main" id="mn" style="background:${bg(l,0)}"></div><div class="th">${Array.from({length:np(l)},(_,i)=>`<div class="${i?'':'on'}" style="background:${bg(l,i)}" onclick="mi(${l.id},${i},this)"></div>`).join('')}</div>
<h1 style="font-size:28px;margin-top:16px">${esc(l.title)}</h1><div class="mut">${esc(l.addr)}</div><div class="chips" style="margin:10px 0"><span class="chip">${l.type}</span><span class="chip">${l.fur}</span><span class="chip">${l.occ}</span><span class="chip">${l.gen==='Any'?'Male / Female':l.gen+' only'}</span>${l.status==='rented'?'<span class="chip" style="color:var(--red)">Rented</span>':''}</div>
<h3>About</h3><p>${esc(l.desc)}</p><h3>Amenities</h3><div class="chips">${l.amen.map(a=>`<span class="chip">✓ ${esc(a)}</span>`).join('')||'–'}</div>
<h3 style="margin-top:14px">Location</h3><div class="box mut">Map preview coming soon (Google Maps integration is prepared). Address: ${esc(l.addr)}</div></div>
<aside class="box" style="align-self:start"><div class="pr" style="font-size:26px">${inr(l.rent)}<small>${t('mo')}</small></div><p class="mut">${t('dep')}: ${inr(l.dep)}<br>Available from: ${l.avail}<br>Owner: ${esc(l.owner)}</p>
<a class="btn" style="display:block;margin-bottom:8px" target="_blank" rel="noopener" href="${wa}">WhatsApp Owner</a><a class="btn o" style="display:block;margin-bottom:8px" href="tel:+91${esc(l.phone)}">Call ${esc(l.phone)}</a>
<label>Send enquiry</label><textarea id="eq" rows="3" placeholder="Hello, I am interested…"></textarea><div class="row"><button class="btn s" onclick="enq(${l.id})">Send</button><button class="btn o s" onclick="tf(${l.id});render()">${isFav(l.id)?'♥ Saved':'♡ Save'}</button><button class="btn o s" onclick="rep(${l.id})">Report listing</button></div></aside></div>`}
function mi(id,i,el){const l=D.L.find(x=>x.id===id);mn.style.background=bg(l,i);document.querySelectorAll('.th div').forEach(d=>d.classList.remove('on'));el.classList.add('on')}
function need(){if(!D.user){alert('Please login or register first.');go('login');return false}return true}
function enq(id){if(!need())return;const m=eq.value.trim();if(!m)return alert('Write a message first.');D.enq.push({lid:id,from:D.user.name,msg:m,t:new Date().toLocaleString('en-IN')});save();eq.value='';alert('Enquiry sent to the owner.')}
function rep(id){const r=prompt('Why are you reporting this listing?');if(r){D.rep.push({lid:id,reason:r,by:D.user?D.user.name:'guest',open:true});save();alert('Thanks – our team will review it.')}}
function login(){return `<div class="box" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">${t('login')}</h2><p class="mut">Demo mode: no real accounts yet. Firebase Authentication plugs in here.</p><div class="fm" style="grid-template-columns:1fr"><div><label>Name</label><input id="ln"></div><div><label>Email</label><input id="le" type="email"></div><div><label>I am a</label><select id="lr"><option value="tenant">Tenant</option><option value="owner">Room owner</option></select></div></div><div class="row"><button class="btn" onclick="doLogin()">Continue</button><button class="btn o" onclick="D.user={name:'Admin',email:'admin@demo',role:'admin'};save();go('admin');render()">Demo admin</button></div></div>`}
function doLogin(){if(!ln.value.trim())return alert('Enter your name');D.user={name:ln.value.trim(),email:le.value.trim(),role:lr.value,phone:''};save();go(D.user.role==='owner'?'owner':'home');render()}
function saved(){const r=D.L.filter(l=>isFav(l.id));return `<h2>♥ ${t('saved')}</h2>`+(r.length?`<div class="g">${r.map(card).join('')}</div>`:'<p class="mut">Nothing saved yet.</p>')}
function profile(){if(!D.user)return login();const u=D.user;return `<div class="box" style="max-width:480px;margin:20px auto"><h2 style="margin-top:0">Profile</h2><label>Name</label><input id="pn" value="${esc(u.name)}"><label style="margin-top:8px">Phone</label><input id="pp" value="${esc(u.phone||'')}"><div class="row"><button class="btn" onclick="saveProfile()">Save</button></div></div>`+saved()}
function owner(){if(!D.user||D.user.role!=='owner')return login();const m=D.L.filter(l=>l.ownerId===D.user.uid),ids=m.map(l=>l.id),e=D.enq.filter(x=>ids.includes(x.lid));
return `<h2>${t('dash')}</h2><div class="st"><div><b>${m.length}</b>Listings</div><div><b>${m.filter(l=>l.status==='approved').length}</b>Live</div><div><b>${m.filter(l=>l.status==='pending').length}</b>Pending review</div><div><b>${e.length}</b>Enquiries</div></div>
<div class="row"><a class="btn" href="#add">${t('add')}</a></div><div class="sc"><table class="tbl"><tr><th>Listing</th><th>Rent</th><th>Status</th><th></th></tr>${m.map(l=>`<tr><td>${esc(l.title)}</td><td>${inr(l.rent)}</td><td>${l.status}</td><td><a class="btn s o" href="#edit-${l.id}">Edit</a> <button class="btn s o" onclick="setS(${l.id},'rented')">Mark rented</button> <button class="btn s r" onclick="del(${l.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan=4 class="mut">No listings yet – new listings are reviewed before going live.</td></tr>'}</table></div>
<h2>Enquiries</h2>${e.map(x=>`<div class="box" style="margin-bottom:8px"><b>${esc(x.from)}</b> <span class="mut">on ${esc(D.L.find(l=>l.id===x.lid).title)} · ${x.t}</span><br>${esc(x.msg)}</div>`).join('')||'<p class="mut">No enquiries yet.</p>'}`}
function setS(id,s){D.L.find(l=>l.id===id).status=s;save();render()}
function del(id){if(confirm('Delete this listing?')){D.L=D.L.filter(l=>l.id!==id);save();render()}}
let ph=[];
function form(id){if(!D.user||D.user.role!=='owner')return login();const l=id?D.L.find(x=>x.id===id):{title:'',city:'',loc:'',type:'Single Room',rent:'',dep:'',fur:'Furnished',gen:'Any',occ:'Single',amen:[],avail:'',addr:'',desc:'',phone:D.user.phone||'',photos:[]};ph=[...(l.photos||[])];
return `<h2>${id?'Edit':t('add')}</h2><div class="fm"><div class="f"><label>Title</label><input id="ft" value="${esc(l.title)}"></div><div><label>City</label><select id="fc">${CITIES.map(c=>`<option ${c==l.city?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Locality</label><input id="fl" value="${esc(l.loc)}"></div><div class="f"><label>Full address</label><input id="fa" value="${esc(l.addr)}"></div>
<div><label>Type</label><select id="fy">${TYPES.map(c=>`<option ${c==l.type?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Monthly rent (₹)</label><input id="fr" type="number" value="${l.rent}"></div><div><label>Deposit (₹)</label><input id="fd" type="number" value="${l.dep}"></div>
<div><label>Furnishing</label><select id="ff">${['Furnished','Semi-furnished','Unfurnished'].map(c=>`<option ${c==l.fur?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Available for</label><select id="fg">${['Any','Male','Female'].map(c=>`<option ${c==l.gen?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Single / Shared</label><select id="fo">${['Single','Shared'].map(c=>`<option ${c==l.occ?'selected':''}>${c}</option>`).join('')}</select></div>
<div><label>Available from</label><input id="fv" type="date" value="${l.avail}"></div><div><label>Contact number (10 digits)</label><input id="fp" value="${esc(l.phone)}" maxlength="10"></div>
<div class="f"><label>Amenities</label><div class="chips">${AM.map(a=>`<label class="chip" style="margin:0"><input type="checkbox" class="am" value="${a}" style="width:auto" ${l.amen.includes(a)?'checked':''}> ${a}</label>`).join('')}</div></div>
<div class="f"><label>Description</label><textarea id="fx" rows="4">${esc(l.desc)}</textarea></div><div class="f"><label>Photos (multiple)</label><input type="file" accept="image/*" multiple onchange="pick(this.files)"><div class="mut" id="pc">${ph.length} photo(s)</div></div></div>
<div class="row"><button class="btn" onclick="sub(${id||0})">${id?'Save changes':'Submit for review'}</button><a class="btn o" href="#owner">Cancel</a></div>`}
function pick(fs){[...fs].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,700/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ph.push(c.toDataURL('image/jpeg',.6));pc.textContent=ph.length+' photo(s)'};i.src=r.result};r.readAsDataURL(f)})}
function sub(id){if(!ft.value.trim()||!fr.value||!/^[6-9]\d{9}$/.test(fp.value))return alert('Add a title, rent and a valid 10-digit mobile number.');
const o={title:ft.value.trim(),city:fc.value,loc:fl.value.trim(),addr:fa.value.trim()||fl.value+', '+fc.value,type:fy.value,rent:+fr.value,dep:+fd.value||0,fur:ff.value,gen:fg.value,occ:fo.value,avail:fv.value,phone:fp.value,desc:fx.value.trim(),amen:[...document.querySelectorAll('.am:checked')].map(x=>x.value),photos:ph};
if(id){Object.assign(D.L.find(l=>l.id===id),o,{status:'pending'})}else D.L.push({...o,id:D.nid++,hue:Math.floor(Math.random()*360),feat:false,owner:D.user.name,status:'pending',flag:false,by:D.user.email+'|'+D.user.name,t:Date.now()});
D.user.phone=fp.value;save();alert('Submitted. It goes live after admin review.');go('owner')}
function admin(){if(!D.user||D.user.role!=='admin')return login();const L=D.L;
return `<h2>Admin dashboard</h2><div class="st"><div><b>${L.length}</b>Listings</div><div><b>${L.filter(l=>l.status==='pending').length}</b>Pending</div><div><b>${L.filter(l=>l.flag).length}</b>Flagged</div><div><b>${D.rep.filter(r=>r.open).length}</b>Open reports</div><div><b>${new Set(L.map(l=>l.ownerId)).size}</b>Owners</div></div>
<h3 style="margin-top:20px">Listings</h3><div class="sc"><table class="tbl"><tr><th>Listing</th><th>Owner</th><th>Status</th><th></th></tr>${L.map(l=>`<tr><td><a href="#room-${l.id}">${esc(l.title)}</a>${l.flag?' 🚩':''}</td><td>${esc(l.owner)}</td><td>${l.status}</td><td><button class="btn s" onclick="setS(${l.id},'approved')">Approve</button> <button class="btn s o" onclick="setS(${l.id},'rejected')">Reject</button> <button class="btn s o" onclick="fg2(${l.id})">Flag</button> <button class="btn s r" onclick="del(${l.id})">Remove</button></td></tr>`).join('')}</table></div>
<h3 style="margin-top:20px">Reported listings</h3>${D.rep.map((r,i)=>`<div class="box" style="margin-bottom:8px"><b>${esc((D.L.find(l=>l.id===r.lid)||{title:'(removed)'}).title)}</b> · by ${esc(r.by)}<br>${esc(r.reason)} ${r.open?`<button class="btn s o" onclick="resolveRep(${i})">Resolve</button>`:'<span class="mut">resolved</span>'}</div>`).join('')||'<p class="mut">No reports.</p>'}
<h3 style="margin-top:20px">Users</h3><p class="mut">User management connects to Firebase Authentication. In demo mode there is one local session only.</p>`}
function fg2(id){const l=D.L.find(x=>x.id===id);l.flag=!l.flag;save();render()}
const pages={about:['About RoomMitra','RoomMitra helps room owners and tenants in India connect directly. Posting and searching are free. We do not take payments or claim to verify listings.'],contact:['Contact','Email: hello@roommitra.example (placeholder – replace before launch).'],privacy:['Privacy Policy','Placeholder text: add your real policy covering contact details, photos and analytics before launch.'],terms:['Terms','Placeholder text: add your real terms. Owners are responsible for the accuracy of their listings; tenants should visit and verify a property before paying anything.']};
function render(){nav();let r=location.hash.slice(1)||'home',h,m;document.title='RoomMitra – Rooms, Flats, PG & Hostels in India';
if(r==='home')h=home();else if(r==='search')h=search();else if(m=r.match(/^room-(\d+)$/))h=room(+m[1]);else if(r==='login')h=login();else if(r==='saved')h=saved();else if(r==='profile')h=profile();else if(r==='owner')h=owner();else if(r==='add')h=form();else if(m=r.match(/^edit-(\d+)$/))h=form(+m[1]);else if(r==='admin')h=admin();else if(pages[r])h=`<h2>${pages[r][0]}</h2><p>${pages[r][1]}</p>`;else h=home();
document.getElementById('app').innerHTML=h;window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithPopup,RecaptchaVerifier,signInWithPhoneNumber}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDJmYKD8xkpTygtB3bh92V65BPpv-tCuII",authDomain:"roommitra-a1b2c.firebaseapp.com",projectId:"roommitra-a1b2c",storageBucket:"roommitra-a1b2c.firebasestorage.app",messagingSenderId:"952016093868",appId:"1:952016093868:web:0fea5fb7e140e379a21509"});
const auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i),W=(n,f)=>{window[n]=f},er=e=>alert(e.message||e);
const M={a:new Map(),o:new Map(),x:new Map()};let un=[];
const rr=()=>{const h=location.hash.slice(1),a=document.activeElement;if(h==='add'||h.startsWith('edit-')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;render()};
const mix=()=>{D.L=[...new Map([...M.a,...M.o,...M.x])].map(e=>e[1]);rr()};
const mp=s=>new Map(s.docs.map(d=>[d.id,d.data()]));
const watch=(q,f)=>un.push(onSnapshot(q,f,e=>console.error(e)));
onSnapshot(query(collection(db,'listings'),where('status','==','approved')),s=>{M.a=mp(s);mix()},e=>console.error(e));
function boot(u,x){D.user={uid:u.uid,...x};D.fav=x.favs||[];
 if(x.role==='owner'){watch(query(collection(db,'listings'),where('ownerId','==',u.uid)),s=>{M.o=mp(s);mix()});watch(query(collection(db,'enquiries'),where('ownerId','==',u.uid)),s=>{D.enq=s.docs.map(d=>d.data());rr()})}
 if(x.role==='admin'){watch(collection(db,'listings'),s=>{M.x=mp(s);mix()});watch(collection(db,'reports'),s=>{D.rep=s.docs.map(d=>({...d.data(),_id:d.id}));rr()})}
 if(location.hash==='#login')go(x.role==='owner'?'owner':x.role==='admin'?'admin':'home');
 mix();nav()}
onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];M.o=new Map();M.x=new Map();D.enq=[];D.rep=[];D.fav=[];
 if(!u){D.user=null;mix();nav();return}
 const s=await getDoc(doc(db,'users',u.uid));
 if(!s.exists()){D.user={uid:u.uid,name:u.displayName||'',email:u.email||'',phone:(u.phoneNumber||'').replace('+91',''),role:null};go('login');nav();render();return}
 boot(u,s.data())});
W('gLogin',()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(er));
W('sendOtp',()=>{const n=$('ph').value.trim();if(!/^[6-9]\d{9}$/.test(n))return alert('Enter a valid 10-digit mobile number');if(window.busy)return;window.busy=1;try{window.rv&&window.rv.clear()}catch(_){}$('rc').innerHTML='<div id="rcx"></div>';window.rv=new RecaptchaVerifier(auth,'rcx',{size:'invisible'});signInWithPhoneNumber(auth,'+91'+n,window.rv).then(c=>{window.cr=c;window.busy=0;$('ob').style.display='block'}).catch(e=>{window.busy=0;er(e);try{window.rv.clear()}catch(_){}window.rv=null})});
W('verOtp',()=>window.cr&&window.cr.confirm($('otp').value.trim()).catch(()=>alert('Wrong OTP')));
W('logout',()=>{signOut(auth);go('home')});
W('login',()=>{const u=D.user;if(u&&!u.role)return`<div class="box" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">Almost done</h2><label>Your name</label><input id="rn" value="${esc(u.name)}"><label style="margin-top:8px">I am a</label><select id="rr"><option value="tenant">Tenant</option><option value="owner">Room owner</option></select><div class="row"><button class="btn" onclick="setRole()">Continue</button></div></div>`;
 return`<div class="box" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">${t('login')}</h2><button class="btn" style="width:100%" onclick="gLogin()">Continue with Google</button><p class="mut" style="text-align:center">or use your mobile number</p><label>Mobile number</label><input id="ph" type="tel" maxlength="10" placeholder="9876543210"><div id="rc"></div><div class="row"><button class="btn o" onclick="sendOtp()">Send OTP</button></div><div id="ob" style="display:none;margin-top:10px"><label>OTP</label><input id="otp" maxlength="6" inputmode="numeric"><div class="row"><button class="btn" onclick="verOtp()">Verify</button></div></div></div>`});
W('setRole',async()=>{const n=$('rn').value.trim();if(!n)return alert('Enter your name');const o={name:n,role:$('rr').value,phone:D.user.phone||'',email:D.user.email||'',favs:[]};try{await setDoc(doc(db,'users',D.user.uid),o);boot({uid:D.user.uid},o);go(o.role==='owner'?'owner':'home');render()}catch(e){er(e)}});
W('tf',id=>{if(!need())return;const i=D.fav.indexOf(id);i<0?D.fav.push(id):D.fav.splice(i,1);updateDoc(doc(db,'users',D.user.uid),{favs:D.fav}).catch(er);document.querySelectorAll('.fav').forEach(b=>{if(b.getAttribute('onclick').includes('tf('+id+')'))b.classList.toggle('on',isFav(id))})});
W('setS',(id,s)=>updateDoc(doc(db,'listings',String(id)),{status:s}).catch(er));
W('del',id=>{if(confirm('Delete this listing?'))deleteDoc(doc(db,'listings',String(id))).then(()=>{M.o.delete(String(id));M.x.delete(String(id));M.a.delete(String(id));mix()}).catch(er)});
W('fg2',id=>{const l=D.L.find(x=>x.id===id);updateDoc(doc(db,'listings',String(id)),{flag:!l.flag}).catch(er)});
W('enq',id=>{if(!need())return;const m=$('eq').value.trim();if(!m)return alert('Write a message first.');const l=D.L.find(x=>x.id===id);addDoc(collection(db,'enquiries'),{lid:id,ownerId:l.ownerId,from:D.user.name,fromId:D.user.uid,msg:m,t:new Date().toLocaleString('en-IN')}).then(()=>{$('eq').value='';alert('Enquiry sent to the owner.')}).catch(er)});
W('rep',id=>{if(!need())return;const r=prompt('Why are you reporting this listing?');if(r)addDoc(collection(db,'reports'),{lid:id,reason:r,by:D.user.name,byId:D.user.uid,open:true}).then(()=>alert('Thanks, our team will review it.')).catch(er)});
W('resolveRep',i=>updateDoc(doc(db,'reports',D.rep[i]._id),{open:false}).catch(er));
W('saveProfile',()=>{const n=$('pn').value,p=$('pp').value;updateDoc(doc(db,'users',D.user.uid),{name:n,phone:p}).then(()=>{D.user.name=n;D.user.phone=p;nav();alert('Saved')}).catch(er)});
W('sub',async id=>{const v=i=>$(i).value;if(!v('ft').trim()||!v('fr')||!/^[6-9]\d{9}$/.test(v('fp')))return alert('Add a title, rent and a valid 10-digit mobile number.');
 const o={title:v('ft').trim(),city:v('fc'),loc:v('fl').trim(),addr:v('fa').trim()||v('fl')+', '+v('fc'),type:v('fy'),rent:+v('fr'),dep:+v('fd')||0,fur:v('ff'),gen:v('fg'),occ:v('fo'),avail:v('fv'),phone:v('fp'),desc:v('fx').trim(),amen:[...document.querySelectorAll('.am:checked')].map(x=>x.value),photos:ph.slice(0,5)};
 if(JSON.stringify(o).length>800000)return alert('Photos are too large. Remove one or two.');
 try{if(id)await updateDoc(doc(db,'listings',String(id)),{...o,status:'pending'});else{const n=Date.now();await setDoc(doc(db,'listings',String(n)),{...o,id:n,ownerId:D.user.uid,owner:D.user.name,status:'pending',flag:false,feat:false,hue:Math.floor(Math.random()*360),t:n})}
 alert('Submitted. It goes live after admin review.');go('owner')}catch(e){er(e)}});
</script>
</body></html>
